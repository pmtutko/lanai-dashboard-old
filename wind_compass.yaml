# === Wind compass page ======================================================
# Clock/date, "paused" and "rotation" now live in the main file.

# --- Sensor info from Home Assistant -----------------------------------------
sensor:
  - platform: homeassistant
    id: wind_speed
    entity_id: sensor.wx_wind_speed
    on_value:
      then:
        - lambda: wx::num1(id(wind_speed_value), x);

  - platform: homeassistant
    id: gust_speed
    entity_id: sensor.wx_wind_gust
    on_value:
      then:
        - lambda: wx::num1(id(wind_gust_value), x);

  - platform: homeassistant
    id: wind_direction
    entity_id: sensor.wx_wind_direction
    on_value:
      then:
        - lvgl.image.update:
            id: rotating_arrow
            # LVGL expects tenths of a degree (0 to 3600)
            rotation: !lambda |-
              return int(x * 10);

# --- Images ---------------------------------------------------------------------
# Background: a JPEG has no alpha channel, so store it opaque (2 bytes/pixel
# instead of 3, about 190 KB smaller).
image:
  - platform: file
    file: "./images/compass-2.jpg"
    type: RGB565
    id: windcompass_bg
    resize: 480x400
    transparency: opaque

  # Arrow: by default this is the original full-canvas image (works unchanged).
  # To save ~500 KB, crop the PNG to just the arrow (centered on the compass
  # centre), then set the three compass_arrow_* substitutions below.
  - platform: file
    file: ${compass_arrow_file}
    type: RGB565
    id: compass_arrow_2a
    resize: ${compass_arrow_resize}
    transparency: alpha_channel

substitutions:
  compass_arrow_file: "./images/arrow-2a.png"
  compass_arrow_resize: 480x400
  compass_arrow_pivot_x: "240"   # half of the arrow image's width
  compass_arrow_pivot_y: "200"   # half of the arrow image's height
  wind_header_text_font: nunito_32
  wind_header_time_font: nunito_36
  value_title_font: nunito_28
  value_units_font: nunito_32

lvgl:
  pages:
    - id: windcompass_display
      on_swipe_left:
        then:
          - lvgl.page.next:
      on_swipe_right:
        then:
          - lvgl.page.previous:
      bg_color: 0x111827
      pad_all: 0
      scrollable: false
      align: CENTER
      widgets:
        - obj:
            id: windcompass_display_whole_screen
            width: 100%
            height: 100%
            align: TOP_LEFT
            x: 0
            y: 0
            bg_color: 0x000000
            border_width: 0
            radius: 0
            scrollbar_mode: "OFF"
            scrollable: false
            pad_all: 0
            on_short_click:
              then:
                - lvgl.page.next:
            widgets:
              # Common page container: header row (date | time) + content area
              - obj:
                  layout:
                    type: grid
                    grid_rows: [CONTENT, FR(1)]
                    grid_columns: [365, 95]
                    pad_row: 0
                    pad_column: 3
                    multiple_widgets_per_cell: true
                  width: 98%
                  height: 98%
                  bg_color: 0x000000
                  border_width: 0
                  radius: 0
                  pad_all: 5
                  scrollbar_mode: "OFF"
                  scrollable: false
                  widgets:
                    - label:
                        id: windcompass_header_date
                        text: "--- -- --- ----"
                        text_font: ${wind_header_text_font}
                        text_color: white
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 0
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER
                    - label:
                        id: windcompass_header_time
                        text: "--:--"
                        text_font: ${wind_header_time_font}
                        text_color: white
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 1
                        grid_cell_x_align: END
                        grid_cell_y_align: CENTER

                    # ~~~~ Content area ~~~~
                    - obj:
                        id: wind_compass_content_cell
                        grid_cell_row_pos: 1
                        grid_cell_column_pos: 0
                        grid_cell_column_span: 2
                        width: 480
                        height: 400
                        pad_all: 0
                        border_width: 0
                        scrollbar_mode: "OFF"
                        scrollable: false
                        # Default layout is NONE, so children stack by absolute x/y
                        widgets:
                          # Background image (layer 0)
                          - image:
                              id: compass_cell_bg
                              src: windcompass_bg
                              x: 0
                              y: 0
                              width: 480
                              height: 400
                              scrollbar_mode: "OFF"
                              scrollable: false

                          - label:
                              id: wind_speed_title
                              text: "Speed"
                              text_font: ${value_title_font}
                              text_color: white
                              x: 10
                              y: 5
                          - obj:
                              id: wind_speed_bounding_box
                              x: 10
                              y: 40
                              width: 85
                              height: 40
                              border_width: 1
                              border_color: 0x000000
                              bg_color: 0x000000
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              scrollable: false
                              widgets:
                                - label:
                                    id: wind_speed_value
                                    text: "--"
                                    text_font: ${value_units_font}
                                    text_color: white
                                    align: CENTER

                          - label:
                              id: wind_gust_title
                              text: "Gust"
                              text_font: ${value_title_font}
                              text_color: white
                              x: 384
                              y: 5
                          - obj:
                              id: wind_gust_bounding_box
                              x: 375
                              y: 40
                              width: 80
                              height: 40
                              border_width: 1
                              border_color: 0x000000
                              bg_color: 0x000000
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              scrollable: false
                              widgets:
                                - label:
                                    id: wind_gust_value
                                    text: "--"
                                    text_font: ${value_units_font}
                                    text_color: white
                                    align: CENTER

                          # Rotating arrow (top layer). Centered on the cell, so the
                          # pivot must be the middle of the arrow image itself.
                          - image:
                              id: rotating_arrow
                              src: compass_arrow_2a
                              align: CENTER
                              pivot_x: ${compass_arrow_pivot_x}
                              pivot_y: ${compass_arrow_pivot_y}
