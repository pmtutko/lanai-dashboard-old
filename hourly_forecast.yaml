# === Hourly forecast page (Google Weather API) =============================
# Refactor notes:
#  * http_request, sun, clock script, page-rotation interval, paused/rotation
#    now live in the main file.
#  * Only the 6 icon text sensors remain (internal, so they are NOT exposed to
#    Home Assistant). Time / temperature / condition labels are written directly
#    by the lambda below, replacing 18 template text sensors.
#  * Icon map shrunk (no duplicate *_DAY / *_NIGHT keys; see wx::icon_key).
#  * Night detection uses the API's own isDaytime flag, so the two sun text
#    sensors and the string parsing are gone.
#  * API key / URL come from secrets.yaml (google_weather_url).

