  hourly_header_time_font: nunito_36
  info_font: nunito_28
  condition_font: nunito_24
  # "opaque" stores 2 bytes/pixel instead of 3. Icons sit on a black page, so it
  # should look the same; switch back to alpha_channel if the edges look rough.
  icon_transparency: opaque

