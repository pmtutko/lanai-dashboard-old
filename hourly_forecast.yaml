text_sensor:
  - platform: template
    id: forecast_icon_0
    internal: true
    on_value:
      then:
        - lvgl.image.update:
            id: hour0_img
            src: !lambda return id(wx_icon_map)[x.c_str()];

  - platform: template
    id: forecast_icon_1
    internal: true
    on_value:
      then:
        - lvgl.image.update:
            id: hour1_img
            src: !lambda return id(wx_icon_map)[x.c_str()];

  - platform: template
    id: forecast_icon_2
    internal: true
    on_value:
      then:
        - lvgl.image.update:
            id: hour2_img
            src: !lambda return id(wx_icon_map)[x.c_str()];

