interval:
  - interval: 15min
    startup_delay: 1min
    then:
      - http_request.get:
          url: !secret google_weather_hourly_url
          max_response_buffer_size: 32kb   # log the body size below, then tune
          capture_response: true
          request_headers:
            Content-Type: application/json
          on_response:
            then:
              - lambda: |-
                  static const char *const TAG = "weather_forecast";
                  if (response->status_code != 200) {
                    ESP_LOGW(TAG, "HTTP status %d", response->status_code);
                    return;
                  }
                  ESP_LOGD(TAG, "Response body: %u bytes", (unsigned) body.size());

                  // Only keep the fields we use; this keeps the parsed document small.
                  JsonDocument filter;
                  filter["forecastHours"][0]["temperature"]["degrees"] = true;
                  filter["forecastHours"][0]["precipitation"]["probability"]["percent"] = true;
                  filter["forecastHours"][0]["weatherCondition"]["description"]["text"] = true;
                  filter["forecastHours"][0]["weatherCondition"]["type"] = true;
                  filter["forecastHours"][0]["displayDateTime"]["hours"] = true;
                  filter["forecastHours"][0]["displayDateTime"]["minutes"] = true;
                  filter["forecastHours"][0]["isDaytime"] = true;

                  JsonDocument doc;
                  DeserializationError error = deserializeJson(doc, body, DeserializationOption::Filter(filter));
                  if (error) {
                    ESP_LOGE(TAG, "JSON Parsing failed: %s", error.c_str());
                    return;
                  }
                  JsonArray forecast_list = doc["forecastHours"];
                  if (forecast_list.isNull()) {
                    ESP_LOGE(TAG, "JSON 'forecastHours' array not found!");
                    return;
                  }

                  lv_obj_t *time_lbl[6] = {id(hour0_time), id(hour1_time), id(hour2_time), id(hour3_time), id(hour4_time), id(hour5_time)};
                  lv_obj_t *temp_lbl[6] = {id(hour0_temp), id(hour1_temp), id(hour2_temp), id(hour3_temp), id(hour4_temp), id(hour5_temp)};
                  lv_obj_t *pct_lbl[6] = {id(hour0_precip_pct), id(hour1_precip_pct), id(hour2_precip_pct), id(hour3_precip_pct), id(hour4_precip_pct), id(hour5_precip_pct)};
                  lv_obj_t *cond_lbl[6] = {id(hour0_condition), id(hour1_condition), id(hour2_condition), id(hour3_condition), id(hour4_condition), id(hour5_condition)};
                  esphome::text_sensor::TextSensor *icon[6] = {id(forecast_icon_0), id(forecast_icon_1), id(forecast_icon_2), id(forecast_icon_3), id(forecast_icon_4), id(forecast_icon_5)};

                  // After 45 minutes past the hour, skip forecast[0] and start at the next hour.
                  // If the clock isn't synced yet, don't skip anything.
                  auto now = esphome::ESPTime::from_epoch_local(::time(nullptr));
                  int offset = (now.is_valid() && now.minute >= 45) ? 1 : 0;
                  int available = (int) forecast_list.size() - offset;
                  int rows = available < 6 ? (available < 0 ? 0 : available) : 6;
                  ESP_LOGD(TAG, "Minute %d, forecast offset %d, showing %d rows", now.minute, offset, rows);
                  for (int i = 0; i < rows; i++) {
                    JsonObject item = forecast_list[i + offset];
                    float temp = item["temperature"]["degrees"] | NAN;
                    float precip_pct = item["precipitation"]["probability"]["percent"] | NAN;
                    const char *cond_text = item["weatherCondition"]["description"]["text"] | "Unknown";
                    const char *cond_type = item["weatherCondition"]["type"] | "TYPE_UNSPECIFIED";

                    // displayDateTime is already in local time
                    int hours = item["displayDateTime"]["hours"] | 0;
                    int minutes = item["displayDateTime"]["minutes"] | 0;
                    char forecast_time[8];
                    snprintf(forecast_time, sizeof(forecast_time), "%02d:%02d", hours, minutes);

                    // Prefer the API's own day/night flag; if it is missing, assume 07:00-19:00 is day
                    bool night = item["isDaytime"].is<bool>() ? !item["isDaytime"].as<bool>()
                                                              : (hours < 7 || hours >= 19);
                    std::string key = wx::icon_key(cond_type, night);

                    ESP_LOGD(TAG, "Forecast %s %s %.1f", forecast_time, key.c_str(), temp);

                    lv_label_set_text(time_lbl[i], forecast_time);
                    wx::deg(temp_lbl[i], temp);
                    wx::pct(pct_lbl[i], precip_pct);
                    lv_label_set_text(cond_lbl[i], cond_text);
                    if (icon[i]->state != key) icon[i]->publish_state(key);
                  }
                  ESP_LOGI(TAG, "Forecast updated successfully");

lvgl:
  pages:
    - id: forecast_display
      on_swipe_left:
        then:
          - lvgl.page.next:
      on_swipe_right:
        then:
          - lvgl.page.previous:
      bg_color: 0x111827
      pad_all: 0
      scrollable: false
      align: CENTER
      widgets:
        - obj:
            id: forecast_display_whole_screen
            width: 100%
            height: 100%
            align: TOP_LEFT
            x: 0
            y: 0
            bg_color: 0x000000
            border_width: 0
            radius: 0
            scrollbar_mode: "OFF"
            scrollable: false
            pad_all: 0
            on_short_click:
              then:
                - lvgl.page.next:
            widgets:
              # Common page container: header row (title | time) + content area
              - obj:
                  layout:
                    type: grid
                    grid_rows: [CONTENT, CONTENT]
                    grid_columns: [365, 95]
                    pad_row: 0
                    pad_column: 3
                  width: 98%
                  height: 98%
                  bg_color: 0x000000
                  border_width: 0
                  radius: 0
                  pad_all: 5
                  scrollable: false
                  widgets:
                    - label:
                        id: header_label
                        text: "Hourly Forecast"
                        text_font: ${forecast_header_text_font}
                        text_color: white
                        grid_cell_row_pos: 0
                        grid_cell_column_pos: 0
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER
                    - label:
                        id: hourly_header_time
