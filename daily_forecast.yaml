# === Daily forecast page (Google Weather API: today + next five days) =========
# Layout per row:  Day | condition icon | high | low | umbrella | precip %
# Row 1 = today's daytime forecast until 18:00, then tonight's (night icon, night
# precip). Rows 2-6 = the next five days.
#
# Depends on hourly_forecast.yaml (must also be included as a package):
#  * re-uses its wx_icon_map and svg_* / img_unknown icon images, so no icon is
#    compiled into flash twice and no ids collide;
#  * nothing else is shared. Every substitution, id and global here is prefixed
#    "daily_" / "day<N>_" so it cannot clash with the hourly page.
#
# Needed elsewhere (see notes in the chat reply):
#  * secrets.yaml:  google_weather_daily_url
#  * lanai-dashboard.yaml: add this file under packages (after hourly_forecasts)
#    and add a daily_header_time line to the update_clock_labels script.
#
# Google "forecast/days:lookup" response, fields used:
#   forecastDays[].displayDate.{year,month,day}
#   forecastDays[].maxTemperature.degrees / minTemperature.degrees
#   forecastDays[].daytimeForecast / nighttimeForecast .weatherCondition.type
#   forecastDays[].daytimeForecast.precipitation.probability.percent
#   forecastDays[].nighttimeForecast.precipitation.probability.percent
# Request days=6 (today + five more).

substitutions:
  daily_header_text_font: nunito_32
  daily_header_time_font: nunito_36
  daily_info_font: nunito_28
  daily_hi_color: "0xFFFF19"
  daily_lo_color: "0x19FFFF"
  # Row 1 = today's daytime forecast until this hour (24h clock), then tonight's.
  daily_evening_hour: "18"
  daily_refresh_interval: 30min
  # NOTE: ESPHome resolves image paths relative to the config folder, like the
  # other pages ("./images/..."). Change this if your umbrella lives elsewhere.
  daily_umbrella_file: "./images/umbrella.png"

image:
  - platform: file
    file: ${daily_umbrella_file}
    id: img_umbrella
    type: RGB565
    resize: 48x48
    transparency: alpha_channel

text_sensor:
  - platform: template
    id: daily_icon_0
    internal: true
    on_value:
      then:
